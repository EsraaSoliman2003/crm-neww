name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Electron is only for the desktop build; the web deploy doesn't need its
      # ~100 MB binary.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Errors fail the build; warnings don't.
      - name: Lint
        run: npm run lint

      # `next typegen` writes next-env.d.ts (git-ignored) so image and route
      # imports type-check.
      - name: Typecheck
        run: npm run typecheck

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # so the build that ships needs all of them (repo Variables).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      # The standalone server only serves .next/static and public/ when they
      # sit next to it, so assemble the full bundle the box will run.
      - name: Assemble deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp ecosystem.config.cjs .next/standalone/

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: deploy-bundle
          path: .next/standalone
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: Deploy to VPS
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits instead of racing an rsync.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    # Skips itself (rather than failing every push to main) until VPS_HOST is
    # set in the repo secrets. The box never pulls or builds: it has no git
    # credentials for this private repo, and building there starves it of RAM,
    # so CI ships the built standalone bundle instead.
    steps:
      # Not configured (no VPS_HOST): skip. Configured but VPS_APP_PATH missing
      # or too shallow: fail. The rsync below runs with --delete, so an empty
      # path would point it at the server's root.
      - name: Check deploy secrets are configured
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_HOST is set but VPS_USER or VPS_SSH_KEY is missing."
            exit 1
          fi
          # Absolute, at least two levels deep (e.g. /var/www/crm-front),
          # no "..".
          app_path="${VPS_APP_PATH%/}"
          case "$app_path" in
            *..*) ok=false ;;
            /*/*) ok=true ;;
            *) ok=false ;;
          esac
          if [ "$ok" != true ]; then
            echo "::error::VPS_APP_PATH is missing or unsafe ('$VPS_APP_PATH'). Set it to the app's own directory, e.g. /var/www/crm-front."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Skip (deploy secrets not configured yet)
        if: steps.check.outputs.configured == 'false'
        run: echo "VPS_HOST secret not set — skipping deploy. See README for setup."

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.configured == 'true'
        with:
          name: deploy-bundle
          path: bundle

      - name: Set up SSH
        if: steps.check.outputs.configured == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # Second guard, on the box: the directory must already exist and be
      # either empty (apart from .env files) or a previous deploy (has
      # server.js). Anything else is not ours to rsync --delete into.
      - name: Check target directory on the server
        if: steps.check.outputs.configured == 'true'
        env:
          REMOTE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy "$REMOTE" bash -s -- "${VPS_APP_PATH%/}" <<'EOF'
          set -eu
          dir="$1"
          if [ ! -d "$dir" ]; then
            echo "::error::$dir does not exist on the server. Create it (with the app's .env.production in it) first."
            exit 1
          fi
          if [ ! -f "$dir/server.js" ] && ls -A "$dir" | grep -qv '^\.env'; then
            echo "::error::$dir has files but no server.js, so it isn't a previous deploy. Refusing to rsync --delete into it."
            exit 1
          fi
          EOF

      # --delete clears files left by older builds; the box's .env files
      # (server-only secrets, loaded by server.js at startup) are excluded so
      # they survive.
      - name: Ship bundle
        if: steps.check.outputs.configured == 'true'
        env:
          REMOTE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          rsync -az --delete --exclude '.env*' \
            -e "ssh -i ~/.ssh/id_deploy" \
            bundle/ "$REMOTE:${VPS_APP_PATH%/}/"

      # If pm2 already runs this app from somewhere else (an older `npm start`
      # checkout somewhere else), replace it instead of reloading it, so
      # the first deploy also does the cutover. Later deploys just reload.
      - name: Restart app
        if: steps.check.outputs.configured == 'true'
        env:
          REMOTE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy "$REMOTE" bash -s -- "${VPS_APP_PATH%/}" <<'EOF'
          set -eu
          cd "$1"
          name=$(node -p "require('./ecosystem.config.cjs').apps[0].name")
          running_from=$(pm2 jlist | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const app = JSON.parse(s).find((p) => p.name === process.argv[1]);
              process.stdout.write(app ? app.pm2_env.pm_cwd : "");
            });' "$name")
          if [ -n "$running_from" ] && [ "$running_from" != "$PWD" ]; then
            echo "Replacing $name, which was running from $running_from"
            pm2 delete "$name"
          fi
          pm2 startOrReload ecosystem.config.cjs
          pm2 save
          EOF